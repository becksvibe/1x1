<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einmaleins</title>
<style>
:root{--bg:#0b0d1a;--panel:#171a33;--ink:#e8ecff;--cyan:#00e5ff;--violet:#b44dff;--ok:#39ff88;--no:#8ab4ff}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;padding:1rem 0 3.5rem}
body{background:radial-gradient(circle at 50% 0%,#1a1f4a 0%,var(--bg) 60%);color:var(--ink);font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(92vw,420px);text-align:center}
.top{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin-bottom:.8rem}
.bar{height:12px;background:var(--panel);border-radius:9px;overflow:hidden;margin-bottom:2.2rem;box-shadow:inset 0 0 0 1px #2a2f5c}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan);transition:width .3s}
#task{font-size:clamp(3.2rem,17vw,5.2rem);font-weight:800;margin:0 0 1.5rem;letter-spacing:.04em;text-shadow:0 0 18px #00e5ff88}
input{width:100%;font:inherit;font-size:2.6rem;font-weight:700;text-align:center;padding:.5rem;border-radius:16px;border:3px solid #2a2f5c;background:#11142a;color:var(--ink)}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 16px #00e5ff77}
input:disabled{opacity:.6}
button{margin-top:1rem;width:100%;font:inherit;font-size:1.4rem;font-weight:800;letter-spacing:.04em;padding:.9rem;border:0;border-radius:16px;background:linear-gradient(90deg,var(--cyan),var(--violet));color:#0b0d1a;cursor:pointer;box-shadow:0 0 18px #b44dff66}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#msg{min-height:2.6rem;margin-top:1.1rem;font-size:1.4rem;font-weight:700}
.ok{color:var(--ok);text-shadow:0 0 12px #39ff8888}.no{color:var(--no)}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
.hidden{display:none}
#emoji{font-size:4.5rem;margin:0}
#res{font-size:2rem;font-weight:800;margin:.5rem 0}
#streakmsg{font-size:1.1rem;font-weight:700;margin:.8rem 0;white-space:pre-line;line-height:1.6}
#up{white-space:pre-line;font-size:1.9rem;font-weight:800;color:var(--ok);margin:.6rem 0;text-shadow:0 0 14px #39ff8899}
#up:empty{display:none}
#lvl{font-size:1.35rem;font-weight:700;margin:.8rem 0 .6rem}
.xp{margin:0 0 .5rem}
#xptext{font-size:1rem;opacity:.8;margin:.2rem 0 1rem}
body{background-color:var(--bg);background-repeat:no-repeat}
#maptitle{font-size:1.15rem;font-weight:700;margin:1.8rem 0 0}
#map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:min(100%,340px);margin:.8rem auto .4rem}
.h{font-size:.7rem;opacity:.6;display:flex;align-items:center;justify-content:center}
.c{aspect-ratio:1;border-radius:4px;background:var(--panel)}
.s1{background:#4f64c9}
.s2{background:#0a8fa3}
.s3{background:var(--ok);box-shadow:0 0 6px #39ff8888}
.new{outline:2px solid var(--ink);animation:pop .6s}
#mapinfo{font-size:1.05rem;font-weight:700;margin:.6rem 0 .2rem}
#legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1rem;font-size:.8rem;opacity:.9;margin:.2rem 0 1rem}
.sw{display:inline-block;width:.95em;height:.95em;border-radius:3px;background:var(--panel);box-shadow:inset 0 0 0 1px #2a2f5c;vertical-align:-.12em;margin-right:.35em}
.sw.s1{background:#4f64c9}
.sw.s2{background:#0a8fa3}
.sw.s3{background:var(--ok);box-shadow:0 0 6px #39ff8888}
#who p{margin:0}
.chip{position:fixed;right:.8rem;bottom:.8rem;width:auto;margin:0;font-size:.72rem;font-weight:600;letter-spacing:0;padding:.25rem .65rem;border-radius:999px;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #2a2f5c;opacity:.5}
.chip:hover,.chip:focus-visible{opacity:1}
#whotitle{font-size:2.2rem;font-weight:800;margin-bottom:1.2rem;text-shadow:0 0 18px #00e5ff88}
#plist button{margin-top:.6rem}
.pbtn{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px #2a2f5c}
#newname{font-size:1.6rem;margin-top:1.2rem}
#whonote{font-size:.95rem;opacity:.8;margin-top:1rem}
#bonus,#total{font-size:1.25rem;margin:.3rem 0}
</style>
</head>
<body>
<main>
  <div id="play">
    <div class="top"><span id="n"></span><span id="stars"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <p id="task"></p>
    <input id="ans" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Antwort">
    <button id="go">Zünden 💥</button>
    <div id="msg" aria-live="polite"></div>
  </div>
  <div id="who" class="hidden">
    <p id="whotitle">Wer übt?</p>
    <div id="plist"></div>
    <input id="newname" maxlength="16" autocomplete="off" placeholder="Dein Name" aria-label="Dein Name">
    <button id="addp">Los geht’s</button>
    <p id="whonote"></p>
  </div>
  <div id="end" class="hidden">
    <p id="emoji"></p>
    <p id="res"></p>
    <p id="bonus"></p>
    <p id="total"></p>
    <p id="streakmsg"></p>
    <p id="up"></p>
    <p id="lvl"></p>
    <div class="bar xp"><i id="xp"></i></div>
    <p id="xptext"></p>
    <button id="again">Nächste Runde ▶</button>
    <p id="maptitle">Deine Einmaleins-Karte 🗺️</p>
    <div id="map"></div>
    <p id="mapinfo"></p>
    <div id="legend">
      <span><i class="sw"></i>noch offen</span>
      <span><i class="sw s1"></i>wackelt</span>
      <span><i class="sw s2"></i>noch nicht flott</span>
      <span><i class="sw s3"></i>sicher und flott</span>
    </div>
  </div>
</main>
<button id="whobtn" class="chip hidden" aria-label="Profil wechseln"></button>
<script>
const LEGACY = 'einmaleins-v1';      // alter Einzel-Datensatz (vor den Profilen)
const PREFIX = 'einmaleins-p-';     // pro Profil: einmaleins-p-<id>
const PKEY = 'einmaleins-profiles'; // Liste der Profile + zuletzt benutztes
const ROUND = 10;
const $ = id => document.getElementById(id);
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
let profiles = read(PKEY) || { list: [], last: null };
let db = null, pid = null;
const saveProfiles = () => { try { localStorage.setItem(PKEY, JSON.stringify(profiles)); } catch (e) {} };
const save = () => { try { localStorage.setItem(PREFIX + pid, JSON.stringify(db)); } catch (e) {} };
function loadDb(id) {
  const d = read(PREFIX + id) || { stats: {}, log: [], stars: 0 };
  d.streak = d.streak || { cur: 0, best: 0, last: '', jokers: 0 };
  return d;
}
let queue, idx, correct, cur, t0, locked, timer, startLevel, startMap;
let expected, curKey, curQ, curLabel, curFull;
const LEVELS = [
  [0, 'Frischer Noob', '🐣'], [20, 'Plastik Bro', ''], [50, 'Düsen-Wurst', ''],
  [100, 'Zombie-Zähler', ''], [180, 'Loot Lurch', ''], [300, 'Filament-Furzer', ''],
  [500, 'Multiplikations-Mutant', ''], [800, 'Creeper-Kneter', ''],
  [1200, 'Filament-Flechter', ''], [1300, 'Plastik Profi', ''], [1400, 'Spaghetti Drucker', ''], [2000, 'Bald 3d-Drucker Besitzer', '']
];
const lvl = g => { let i = 0; while (i + 1 < LEVELS.length && g >= LEVELS[i + 1][0]) i++; return i; };

// Aufgaben mit mehr Fehlern kommen häufiger dran
// ---- Profile ("Wer übt?") ----
function showWho() {
  clearTimeout(timer);
  $('play').classList.add('hidden'); $('end').classList.add('hidden'); $('who').classList.remove('hidden');
  $('whobtn').classList.add('hidden');
  const list = $('plist'); list.innerHTML = '';
  profiles.list.forEach(pr => {
    const b = document.createElement('button');
    b.className = 'pbtn'; b.textContent = pr.name;
    b.addEventListener('click', () => selectProfile(pr.id));
    list.appendChild(b);
  });
  const first = profiles.list.length === 0;
  $('whonote').textContent = first
    ? (localStorage.getItem(LEGACY) ? 'Dein bisheriger Fortschritt wird übernommen.' : 'Schreib deinen Namen, dann merkt sich die App deinen Fortschritt.')
    : '';
  $('newname').placeholder = first ? 'Dein Name' : 'Neuer Name';
  $('newname').value = '';
  if (first) $('newname').focus();
}
function selectProfile(id) {
  const pr = profiles.list.find(x => x.id === id);
  if (!pr) { showWho(); return; }
  pid = id; db = loadDb(id);
  profiles.last = id; saveProfiles();
  $('whobtn').textContent = '👤 ' + pr.name;
  $('who').classList.add('hidden');
  $('whobtn').classList.remove('hidden');
  newRound();
}
function addProfile() {
  const name = $('newname').value.trim().slice(0, 16);
  if (!name) return;
  const id = Math.random().toString(36).slice(2, 8);
  profiles.list.push({ id: id, name: name });
  if (profiles.list.length === 1) { // Fortschritt aus der Zeit vor den Profilen übernehmen
    try { const old = localStorage.getItem(LEGACY); if (old) localStorage.setItem(PREFIX + id, old); } catch (e) {}
  }
  selectProfile(id);
}
function start() {
  if (profiles.last && profiles.list.some(x => x.id === profiles.last)) selectProfile(profiles.last);
  else showWho();
}

// ---- Streak ----
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dn = x => { const [y, m, d] = x.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const tage = n => n + (n === 1 ? ' Tag' : ' Tage');
const MILE = { 3: 5, 7: 10, 14: 20, 30: 50 };
// aktuell gültiger Streak (0, wenn er ohne Joker gerissen wäre)
function shownStreak() {
  const st = db.streak;
  if (!st.last) return 0;
  const gap = dn(today()) - dn(st.last);
  if (gap <= 1) return st.cur;
  return st.jokers >= gap - 1 ? st.cur : 0;
}
// wird einmal pro abgeschlossener Runde aufgerufen, zählt aber nur 1x pro Tag
function updateStreak() {
  const st = db.streak, t = today(), lines = [];
  if (st.last === t) return ['🔥 Streak: ' + tage(st.cur) + (st.best > st.cur ? ' (Rekord ' + st.best + ')' : '')];
  if (!st.last) st.cur = 1;
  else {
    const gap = dn(t) - dn(st.last), missed = gap - 1;
    if (gap <= 1) st.cur++;
    else if (st.jokers >= missed) { st.jokers -= missed; st.cur++; lines.push('🃏 Joker eingesetzt, dein Streak lebt!'); }
    else { st.cur = 1; st.broke = true; lines.push('Neuer Start! Dein Rekord bleibt: ' + tage(st.best)); }
  }
  st.last = t;
  const record = st.best > 0 && st.cur > st.best;
  if (st.cur > st.best) st.best = st.cur;
  if (MILE[st.cur]) { db.stars += MILE[st.cur]; lines.push('🎁 ' + tage(st.cur) + ' am Stück! +' + MILE[st.cur] + ' Bonus-Diamanten'); }
  if (st.cur % 7 === 0 && st.jokers < 2) { st.jokers++; lines.push('🃏 Neuer Joker verdient!'); }
  if (record && st.broke) lines.push('🏅 Neuer Rekord!');
  if (st.jokers > 0) lines.push('Joker: ' + '🃏'.repeat(st.jokers));
  save();
  return ['🔥 Streak: ' + tage(st.cur) + (st.best > st.cur ? ' (Rekord ' + st.best + ')' : '')].concat(lines);
}

// ---- Tempo ----
// Basis = seine typische Zeit (Median), mindestens 3 s
function baseMs(type) { // 'm' Mal, 'd' Geteilt, 'l' Lücke
  const typeOf = k => k[0] === 'd' ? 'd' : k[0] === 'l' ? 'l' : 'm';
  const v = Object.keys(db.stats).filter(k => typeOf(k) === type && db.stats[k].tn >= 2)
    .map(k => db.stats[k].ms).sort((a, b) => a - b);
  const min = { m: 3000, d: 4500, l: 4000 }[type], def = { m: 4000, d: 6000, l: 5000 }[type];
  return v.length ? Math.max(min, v[Math.floor(v.length / 2)]) : def;
}
// 0 = flott ... 2 = deutlich langsamer als sonst (zählt erst ab 2 Zeitmessungen voll)
function slowness(s, base) {
  if (!s || !s.tn) return 0;
  return Math.min(2, Math.max(0, (s.ms - base) / base)) * Math.min(1, s.tn / 2);
}
let curBase = 4000;
const isSlow = s => s.tn >= 2 && s.ms > Math.max(5000, 1.5 * curBase);

// 0 offen, 1 wackelt, 2 lernt, 3 sicher
function cellState(a, b) {
  const s = db.stats[Math.min(a, b) + 'x' + Math.max(a, b)];
  if (!s || s.r + s.w === 0) return 0;
  if (s.r >= 3 && s.r >= 3 * s.w && !isSlow(s)) return 3;
  return s.r > s.w ? 2 : 1;
}
function snapshot() {
  curBase = baseMs('m');
  const o = [];
  for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) o.push(cellState(a, b));
  return o;
}
function drawMap() {
  curBase = baseMs('m');
  const g = $('map'); g.innerHTML = '';
  const add = (t, c) => { const d = document.createElement('div'); d.className = c; d.textContent = t; g.appendChild(d); };
  add('×', 'h'); for (let b = 1; b <= 10; b++) add(b, 'h');
  let done = 0, i = 0;
  for (let a = 1; a <= 10; a++) {
    add(a, 'h');
    for (let b = 1; b <= 10; b++, i++) {
      const st = cellState(a, b);
      if (st === 3) done++;
      add('', 'c s' + st + (st >= 2 && st > startMap[i] ? ' new' : ''));
    }
  }
  $('mapinfo').textContent = done + ' von 100 Feldern sicher';
}

// ---- Geteilt-Aufgaben ----
const DIV_FROM = 4; // ab Level 5 (Index 4)
// Anzahl Geteilt-Aufgaben pro Runde: Level 5: 1-2 ... letztes Level: 4-5 (höchstens die Hälfte)
function divCount(L) {
  if (L < DIV_FROM) return 0;
  const span = Math.max(1, LEVELS.length - 1 - DIV_FROM);
  const max = Math.min(Math.floor(ROUND / 2), Math.round(2 + (L - DIV_FROM) * 3 / span));
  const lo = Math.max(1, max - 1);
  return lo + Math.floor(Math.random() * (max - lo + 1));
}
// ---- Lückenaufgaben (4 × ? = 20) ----
const GAP_FROM = 2; // ab Level 3 (Index 2), als Brücke zum Geteilt-Rechnen
// 1-2 pro Runde; Geteilt- und Lückenaufgaben zusammen höchstens die Hälfte der Runde
function gapCount(L, nDiv) {
  if (L < GAP_FROM) return 0;
  const room = Math.floor(ROUND / 2) - nDiv;
  if (room <= 0) return 0;
  return 1 + Math.floor(Math.random() * Math.min(2, room));
}
// zieht n verschiedene Aufgaben, Gewicht w
function draw(pool, n, w) {
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((x, p) => x + w(p), 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length - 1; i++) { r -= w(pool[i]); if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

function newRound() {
  const weightOf = (key, base) => {
    const s = db.stats[key] || {};
    return Math.max(0.3, 1 + 2 * (s.w || 0) - 0.3 * (s.r || 0) + 1.5 * slowness(s, base));
  };
  const baseM = baseMs('m'), baseD = baseMs('d'), baseG = baseMs('l');
  const mPool = [], dPool = [], gPool = [];
  for (let a = 1; a <= 10; a++) for (let b = a; b <= 10; b++) mPool.push([a, b]);
  for (let d = 2; d <= 10; d++) for (let q = 1; q <= 10; q++) { dPool.push([d, q]); gPool.push([d, q]); } // d/q = Teiler/Ergebnis, bei Lücken: gezeigter/fehlender Faktor
  const L = lvl(db.stars), nDiv = divCount(L), nGap = gapCount(L, nDiv);
  queue = draw(mPool, ROUND - nDiv - nGap, p => weightOf(p[0] + 'x' + p[1], baseM)).map(p => ({ t: 'm', a: p[0], b: p[1] }))
    .concat(draw(dPool, nDiv, p => weightOf('d' + p[0] + 'x' + p[1], baseD)).map(p => ({ t: 'd', d: p[0], q: p[1] })))
    .concat(draw(gPool, nGap, p => weightOf('l' + p[0] + 'x' + p[1], baseG)).map(p => ({ t: 'g', s: p[0], m: p[1], first: Math.random() < 0.5 })));
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  const firstM = queue.findIndex(x => x.t === 'm'); // sanfter Start: erste Aufgabe ist ein Mal-Rechnen
  if (firstM > 0) [queue[0], queue[firstM]] = [queue[firstM], queue[0]];
  idx = 0; correct = 0; startLevel = lvl(db.stars); startMap = snapshot();
  $('end').classList.add('hidden'); $('who').classList.add('hidden');
  $('play').classList.remove('hidden');
  show();
}

function show() {
  const it = queue[idx];
  if (it.t === 'd') {
    cur = [it.d * it.q, it.d]; expected = it.q; curKey = 'd' + it.d + 'x' + it.q;
    curLabel = cur[0] + ' : ' + cur[1]; curQ = cur[0] + ':' + cur[1];
    curFull = curLabel + ' = ' + expected;
  } else if (it.t === 'g') {
    const prod = it.s * it.m;
    cur = [it.s, it.m]; expected = it.m; curKey = 'l' + it.s + 'x' + it.m;
    curLabel = it.first ? '? × ' + it.s + ' = ' + prod : it.s + ' × ? = ' + prod;
    curQ = it.first ? '?x' + it.s + '=' + prod : it.s + 'x?=' + prod;
    curFull = it.first ? it.m + ' × ' + it.s + ' = ' + prod : it.s + ' × ' + it.m + ' = ' + prod;
  } else {
    cur = Math.random() < 0.5 ? [it.a, it.b] : [it.b, it.a]; expected = cur[0] * cur[1];
    curKey = Math.min(it.a, it.b) + 'x' + Math.max(it.a, it.b);
    curLabel = cur[0] + ' × ' + cur[1]; curQ = cur[0] + 'x' + cur[1];
    curFull = curLabel + ' = ' + expected;
  }
  $('task').textContent = curLabel;
  $('task').style.fontSize = curLabel.length > 8 ? 'clamp(2.2rem,11.5vw,3.6rem)' : ''; // längere Aufgaben etwas kleiner
  $('n').textContent = (idx + 1) + ' / ' + ROUND;
  $('stars').textContent = '🔥 ' + shownStreak() + '   💎 ' + db.stars;
  $('bar').style.width = (idx / ROUND * 100) + '%';
  $('msg').textContent = ''; $('msg').className = '';
  const input = $('ans');
  input.value = ''; input.disabled = false;
  $('go').textContent = 'Zünden 💥';
  locked = false; t0 = Date.now();
  input.focus();
}

function submit() {
  if (locked) { next(); return; }
  const v = $('ans').value.trim();
  if (v === '') return;
  const key = curKey;
  const answer = expected;
  const ok = Number(v) === answer;
  const s = db.stats[key] = db.stats[key] || { r: 0, w: 0 };
  if (ok) { s.r++; const ms = Math.min(Date.now() - t0, 15000); s.ms = s.tn ? Math.round(s.ms * 0.5 + ms * 0.5) : ms; s.tn = (s.tn || 0) + 1; } else s.w++;
  db.log.push({ t: new Date().toISOString(), q: curQ, a: Number(v), ok: ok, ms: Date.now() - t0 });
  if (db.log.length > 5000) db.log.shift();
  locked = true;
  $('ans').disabled = true;
  const m = $('msg');
  if (ok) {
    correct++; db.stars++;
    m.textContent = 'Treffer! 💎'; m.className = 'ok pop';
    timer = setTimeout(next, 700);
  } else {
    m.textContent = 'Fast! ' + curFull;
    m.className = 'no';
    $('go').textContent = 'Weiter ➜';
    $('go').focus();
  }
  save();
}

function next() {
  clearTimeout(timer);
  idx++;
  if (idx >= ROUND) finish(); else show();
}

function finish() {
  const perfect = correct === ROUND;
  if (perfect) { db.stars += 3; save(); }
  const sm = updateStreak();
  $('play').classList.add('hidden');
  $('end').classList.remove('hidden');
  $('emoji').textContent = perfect ? '🏆' : correct >= 7 ? '🎉' : '💪';
  $('res').textContent = correct + ' von ' + ROUND + ' richtig';
  $('bonus').textContent = perfect ? 'Alles richtig: +3 Bonus-Diamanten!' : '';
  $('total').textContent = '💎 ' + db.stars + ' gesammelt';
  $('streakmsg').textContent = sm.join('\n');
  const L = lvl(db.stars), lv = LEVELS[L], nx = LEVELS[L + 1];
  $('up').textContent = L > startLevel ? 'LEVEL UP! 🎊' + (L >= GAP_FROM && startLevel < GAP_FROM ? '\nNeu: Lückenaufgaben (4 × ? = 20)' : '') + (L >= DIV_FROM && startLevel < DIV_FROM ? '\nNeu: Geteilt-Aufgaben ➗' : '') : '';
  $('up').className = L > startLevel ? 'pop' : '';
  $('lvl').textContent = 'Level ' + (L + 1) + ' · ' + (lv[1] + ' ' + lv[2]).trim();
  $('xp').style.width = nx ? ((db.stars - lv[0]) / (nx[0] - lv[0]) * 100) + '%' : '100%';
  $('xptext').textContent = nx ? 'Noch ' + (nx[0] - db.stars) + ' 💎 bis zum nächsten Level 👀' : 'Höchstes Level erreicht!';
  drawMap();
  window.scrollTo(0, 0);
  $('again').focus();
}

$('go').addEventListener('click', submit);
$('again').addEventListener('click', newRound);
$('whobtn').addEventListener('click', showWho);
$('addp').addEventListener('click', addProfile);
$('ans').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!$('who').classList.contains('hidden')) {
      if (e.target.tagName === 'BUTTON') return; // normaler Klick auf Namen oder Button
      e.preventDefault(); addProfile(); return;
    }
    e.preventDefault();
    if (!$('end').classList.contains('hidden')) newRound(); else submit();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !locked) t0 = Date.now(); });
start();
</script>
</body>
</html>
